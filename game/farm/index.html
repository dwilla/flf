<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>Fourth Light Farm</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #3B2A1E; font-family: Arial, Helvetica, sans-serif; }
      #unity-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block; background: #6F9A45; }
      #loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #6F9A45; color: #F6E9C8; transition: opacity 0.4s; }
      #loading h1 { margin: 0 0 18px; font-size: clamp(22px, 5vw, 44px); letter-spacing: 3px; color: #F2B134; text-shadow: 2px 3px 0 #3B2A1E; text-align: center; }
      #bar { width: min(320px, 60vw); height: 14px; background: #3B2A1E; border-radius: 8px; overflow: hidden; }
      #fill { height: 100%; width: 0; background: #F2B134; }
      #msg { margin: 14px 24px 0; font-size: 16px; text-align: center; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <h1>FOURTH LIGHT FARM</h1>
      <div id="bar"><div id="fill"></div></div>
      <p id="msg">Planting the field...</p>
    </div>
    <script src="Build/c54fc75d78144726534c920bb893660b.loader.js"></script>
    <script>
      var fill = document.getElementById("fill");
      var loading = document.getElementById("loading");
      var msg = document.getElementById("msg");
      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/73309bcb6baf35241cd97bce97f31237.data.unityweb",
        frameworkUrl: "Build/af6b25a53eb4560cdc843a7d916b2f23.framework.js.unityweb",
        codeUrl: "Build/2a22380521d8bc2ebc3ca8d29d8b2dd6.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Fourth Light Farm",
        productName: "Fourth Light Farm",
        productVersion: "0.1.0",
      }, function (progress) {
        fill.style.width = (progress * 100) + "%";
      }).then(function () {
        loading.style.opacity = 0;
        setTimeout(function () { loading.style.display = "none"; }, 400);
      }).catch(function (message) {
        msg.textContent = "Sorry, the game could not start. " + message;
      });
    </script>
  </body>
</html>
